[project]
name = "sqli-sentinel"
version = "0.1.0"
description = "SQL injection detection for JavaScript/TypeScript: AST parsing + fine-tuned CodeBERT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI File()/Form() defaults are idiomatic

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
